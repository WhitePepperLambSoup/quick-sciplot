name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # tauri-build embeds ../dist and requires the external sidecar binary to exist.
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Create placeholder backend sidecar
        working-directory: frontend/src-tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force binaries | Out-Null
          New-Item -ItemType File -Force binaries/quick-sciplot-backend-x86_64-pc-windows-msvc.exe | Out-Null
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        working-directory: frontend/src-tauri
        run: cargo fmt --check
      - name: Run Rust lints
        working-directory: frontend/src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Run Rust tests
        working-directory: frontend/src-tauri
        run: cargo test --locked --lib
