[package]
name = "quick-sciplot"
version = "0.3.0"
description = "LLM-powered scientific plotting desktop application"
authors = ["pic contributors"]
edition = "2021"

[lib]
name = "quick_sciplot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
